name: Android

# Builds the debug APK and runs the shared test suite on the desktop JVM. Both
# land as workflow artifacts, so a device can be tested against without a local
# Android SDK — download, unzip, install.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The module compiles Java and Kotlin at 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an SDK, but this pins the packages the
      # build needs and accepts the licences non-interactively.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pure-JVM tests: sphere geometry, the alignment gate, the equirectangular
      # fit and the GPano XMP splice — the common code running on the desktop
      # JVM. No emulator involved. iOS targets are skipped off macOS by design.
      - name: Shared test suite
        run: ./gradlew :composeApp:jvmTest --no-daemon

      - name: Lint
        run: ./gradlew :composeApp:lintDebug --no-daemon
        continue-on-error: true

      # One universal APK: OpenCV is gone from the dependency graph, so there
      # are no ABI splits any more.
      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nalabo360-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
