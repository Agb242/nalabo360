[versions]
agp = "9.3.1"
kotlin = "2.2.10"

# Compose Multiplatform — replaces the Jetpack Compose BOM so the same UI code
# compiles for Android and iOS (plus the JVM target used for local unit tests).
composeMultiplatform = "1.9.0"

coroutines = "1.10.1"
okio = "3.9.0"
kotlinxDatetime = "0.6.1"

coreKtx = "1.15.0"
activityCompose = "1.9.3"

# Lifecycle's Compose glue (collectAsStateWithLifecycle, LifecycleStartEffect)
# stays an Android-side convenience; the shared code uses plain collectAsState.
lifecycle = "2.8.7"

# CameraX — keep all four artifacts on the same version.
camerax = "1.4.0"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.3.7" }

# CameraX
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
